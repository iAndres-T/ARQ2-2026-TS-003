spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:identity}
    password: ${SPRING_DATASOURCE_PASSWORD:identity}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000} # ms (Hikari takes a long, not a Duration); fail fast so a DB outage is a 503, not a hung request
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # unused here (all endpoints are public) but required by the shared security baseline; fetched lazily
          jwk-set-uri: ${JWKS_URI:http://localhost:8080/api/v1/.well-known/jwks.json}

identity:
  access-token-ttl: ${ACCESS_TOKEN_TTL:3600s}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
  max-failed-logins: ${MAX_FAILED_LOGINS:5}
  lockout: ${LOCKOUT_DURATION:15m}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://jaeger:4318}/v1/traces
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      spring.security: false  # filter-chain spans are noise in Jaeger
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # traces only: metrics are scraped by Prometheus, logs are collected by Alloy
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    json:
      rename:
        # Loki/Grafana correlation (D12): {container="x"} | json | trace_id="..."
        traceId: trace_id
        spanId: span_id
