spring.application.name=video-provider
# base of the join URLs handed to participants (host-side address of the mock rooms)
video-provider.public-url=${VIDEO_PROVIDER_PUBLIC_URL:http://localhost:8090}
management.endpoints.web.exposure.include=health,prometheus
logging.structured.format.console=ecs
logging.structured.json.rename.traceId=trace_id
logging.structured.json.rename.spanId=span_id
# recording simulation (Task 14 / D9)
video-provider.webhook-url=${WEBHOOK_URL:https://api-gateway:8443/api/v1/webhooks/video-provider}
video-provider.webhook-secret=${VIDEO_WEBHOOK_SECRET:dev-video-webhook-secret}
video-provider.recording.mode=${RECORDING_MODE:completed}
video-provider.recording.delay=5s
video-provider.storage.endpoint=${MINIO_ENDPOINT:http://minio:9000}
video-provider.storage.access-key=${MINIO_ROOT_USER:medconnect}
video-provider.storage.secret-key=${MINIO_ROOT_PASSWORD:medconnect-secret}
video-provider.storage.bucket=medconnect-recordings
# tracing: OTLP/HTTP to Jaeger, traces only (metrics scraped, logs collected)
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_ENDPOINT:http://jaeger:4318}/v1/traces
management.tracing.sampling.probability=1.0
management.observations.enable.spring.security=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
# trust the gateway's dev certificate (mounted from the gateway-certs volume)
video-provider.webhook-ssl-bundle=${WEBHOOK_SSL_BUNDLE:}
# the compose file defines the bundle: SPRING_SSL_BUNDLE_PEM_GATEWAY_TRUSTSTORE_CERTIFICATE=file:/certs/gateway.crt
