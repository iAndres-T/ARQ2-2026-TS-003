server:
  port: 8443
  ssl:
    # dev keystore is generated by the gateway-cert compose service; unset = plain HTTP (tests)
    enabled: ${GATEWAY_SSL_ENABLED:false}
    key-store: ${GATEWAY_KEYSTORE:file:/certs/gateway.p12}
    key-store-type: PKCS12
    key-store-password: ${GATEWAY_KEYSTORE_PASSWORD:changeit}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://identity-service:8080/api/v1/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webflux:
          # Order matters: first match wins. No path rewriting.
          routes:
            - id: identity
              uri: ${ROUTE_IDENTITY_URI:http://identity-service:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/.well-known/jwks.json
            - id: video-webhook
              uri: ${ROUTE_RECORDING_URI:http://recording-service:8080}
              predicates:
                - Path=/api/v1/webhooks/video-provider
            - id: recording
              uri: ${ROUTE_RECORDING_URI:http://recording-service:8080}
              predicates:
                - Path=/api/v1/consultations/*/recording
            - id: consultation
              uri: ${ROUTE_CONSULTATION_URI:http://consultation-service:8080}
              predicates:
                - Path=/api/v1/consultations/**
            - id: triage
              uri: ${ROUTE_TRIAGE_URI:http://triage-service:8080}
              predicates:
                - Path=/api/v1/triage/**
            - id: care-queue
              uri: ${ROUTE_QUEUE_URI:http://care-queue-service:8080}
              predicates:
                - Path=/api/v1/queue/**
            - id: scheduling
              uri: ${ROUTE_SCHEDULING_URI:http://scheduling-service:8080}
              predicates:
                - Path=/api/v1/doctors/**,/api/v1/shifts/**
            - id: prescription
              uri: ${ROUTE_PRESCRIPTION_URI:http://prescription-service:8080}
              predicates:
                - Path=/api/v1/prescriptions/**
            - id: audit
              uri: ${ROUTE_AUDIT_URI:http://audit-service:8080}
              predicates:
                - Path=/api/v1/audit/**

gateway:
  jwt:
    issuer: medconnect-identity
    audience: medconnect-api
  rate-limit:
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:20}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:40}

management:
  server:
    # plain internal port for healthcheck/Prometheus; never published to the host
    port: 8080
    ssl:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://jaeger:4318}/v1/traces
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      spring.security: false  # filter-chain spans are noise in Jaeger
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # traces only: metrics are scraped by Prometheus, logs are collected by Alloy
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
    json:
      rename:
        # Loki/Grafana correlation (D12): {container="x"} | json | trace_id="..."
        traceId: trace_id
        spanId: span_id
